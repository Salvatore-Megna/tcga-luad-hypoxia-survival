name: Prepare TCGA report assets for bilingual audit

on:
  push:
    branches:
      - review/tcga-bilingual-report-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package report source, historical PDF and original figures
        uses: actions/upload-artifact@v4
        with:
          name: tcga-historical-report-assets
          path: |
            report/main.tex
            report/report.pdf
            report/figures/
            docs/original_overleaf_source.tex
          retention-days: 7
