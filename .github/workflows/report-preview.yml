name: Preview translated TCGA-LUAD report

on:
  push:
    branches:
      - review/tcga-bilingual-report-20261104
  workflow_dispatch:

permissions:
  contents: write

jobs:
  english-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF validation tools
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Translate original vector-figure labels
        run: python report/en/translate_figures.py
      - name: Compile full English report
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: report/en
      - name: Prepare review PDF
        run: |
          test -s report/en/main.pdf
          cp report/en/main.pdf report/en/report.pdf
      - name: Validate English report structure and historical numbers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import pymupdf

          italian = Path("report/main.tex").read_text(encoding="utf-8")
          english = Path("report/en/main.tex").read_text(encoding="utf-8")
          for source in (italian, english):
              assert source.count(r"\begin{table}") == 8
              assert source.count(r"\begin{figure}") == 12
              assert source.count(r"\begin{equation}") == 2

          # Preserve original model values and patient counts exactly.
          critical = ("566", "505", "501", "485", "177", "308", "1,117",
                      "1,107", "0,461", "0,016", "49,1", "0,546", "0,398", "0,246")
          for value in critical:
              assert value in italian and value in english, value

          with pymupdf.open("report/report.pdf") as source, pymupdf.open("report/en/report.pdf") as translated:
              print("Italian pages:", len(source), "English pages:", len(translated))
              assert len(source) == 17
              assert all(abs(p.rect.width - 595.276) < 1 for p in translated)
              assert all(abs(p.rect.height - 841.89) < 1 for p in translated)
              text = "\n".join(p.get_text() for p in translated)
              for label in ("Tumor hypoxia and survival", "Kaplan", "Schoenfeld",
                            "Buffa", "Conclusions", "Sources"):
                  assert label in text, label
              assert len(translated) == len(source), "Check English pagination before approval"
          print("Validated 8 tables, 12 figures, 2 equations and historical results.")
          PY
      - name: Preserve review PDF even if pagination check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcga-english-report-preview
          path: |
            report/report.pdf
            report/en/report.pdf
            report/en/main.pdf
            report/en/figures/*.pdf
          retention-days: 7
      - name: Save validated English files on private review branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/en/report.pdf report/en/figures/
          if ! git diff --cached --quiet; then
            git commit -m "docs: save validated English TCGA report [skip ci]"
            git push origin HEAD:review/tcga-bilingual-report-20261104
          fi
